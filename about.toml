# cargo-about configuration: which licenses we accept in dependencies, and which targets we
# ship. `task licenses` regenerates THIRD_PARTY_LICENSES.html from it.
accepted = [
    "Apache-2.0",
    "MIT",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "EUPL-1.2",
    "BSL-1.0",
    "CC0-1.0",
]
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
