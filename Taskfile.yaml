# https://taskfile.dev
version: '3'

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  # Graphics mode for the run tasks: vga (default), ega, c64, cga, hercules.
  GFX: '{{ .GFX | default "" }}'
  GFX_MODES: vga ega c64 cga hercules
  # Where `web:export` copies the browser build (e.g. a SvelteKit app's static/cookie-doh).
  DEST: '{{ .DEST | default "" }}'

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  setup:
    desc: Install the wasm target, trunk and cargo-about (skips what's already there)
    cmds:
      - rustup target add wasm32-unknown-unknown
      - sh -c 'command -v trunk >/dev/null || cargo install trunk --locked'
      - sh -c 'command -v cargo-about >/dev/null || cargo install cargo-about --locked --features cli'

  licenses:
    desc: Regenerate THIRD_PARTY_LICENSES.html (notices for every bundled dependency)
    preconditions:
      - sh: command -v cargo-about
        msg: "cargo-about not found — run: cargo install cargo-about --locked --features cli"
    sources: [Cargo.lock, about.toml, about.hbs]
    generates: [THIRD_PARTY_LICENSES.html]
    cmds:
      - cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

  snapshot:
    desc: Render every screen to PNG and the audio to WAV in snapshots/ (no window)
    cmds:
      - cargo run -q --release --example snapshot -- snapshots

  run:
    desc: Run the game (PROFILE=debug|release, GFX=ega|c64|cga|hercules)
    vars:
      # Derived here, not globally, so callers passing GFX (run:ega, ...) are honoured.
      GFX_FLAG: '{{ if .GFX }}--gfx={{ .GFX }}{{ end }}'
      INTRO_FLAG: '{{ if .INTRO }}--cracktro{{ end }}'
    preconditions: &run-preconditions
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
      - sh: test -z "{{.GFX}}" || echo "{{.GFX_MODES}}" | tr ' ' '\n' | grep -qx "{{.GFX}}"
        msg: "unknown GFX={{.GFX}} — use one of: {{.GFX_MODES}}"
    cmds:
      - cargo run {{.PROFILE_FLAG}} -- {{.INTRO_FLAG}} {{.GFX_FLAG}} {{.CLI_ARGS}}

  run:cracked:
    desc: Run with the Cookies & Crackers cracktro first (combines with GFX=...)
    aliases: [cracked, intro, run:cracktro]
    cmds:
      - task: run
        vars: { INTRO: "1", GFX: "{{.GFX}}" }

  run:ega:
    desc: Run in EGA mode (16 colors)
    aliases: [ega]
    cmds:
      - task: run
        vars: { GFX: ega }

  run:c64:
    desc: Run in C64 mode (16 colors, fat pixels)
    aliases: [c64]
    cmds:
      - task: run
        vars: { GFX: c64 }

  run:cga:
    desc: Run in CGA mode (cyan, magenta, white - sorry)
    aliases: [cga]
    cmds:
      - task: run
        vars: { GFX: cga }

  run:hercules:
    desc: Run in Hercules mode (amber monochrome)
    aliases: [hercules, hgc]
    cmds:
      - task: run
        vars: { GFX: hercules }

  run:retro:
    desc: The full experience - cracktro, then C64 mode
    cmds:
      - task: run
        vars: { INTRO: "1", GFX: c64 }

  build:
    desc: Build (PROFILE=debug|release)
    cmds:
      - cargo build {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - cargo test {{.CLI_ARGS}}

  fmt:
    desc: Format sources
    aliases: [format]
    cmds:
      - cargo fmt --all

  lint:
    desc: Clippy (warnings as errors)
    cmds:
      - cargo clippy --all-targets -- -D warnings

  check:
    desc: Format check + clippy
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets -- -D warnings

  check:wasm:
    desc: Clippy for the browser target (wasm32-unknown-unknown)
    preconditions:
      - sh: rustup target list --installed | grep -qx wasm32-unknown-unknown
        msg: "wasm target missing — run: rustup target add wasm32-unknown-unknown"
    cmds:
      - cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

  web:
    desc: Run in the browser with live rebuild at http://localhost:8080 (needs trunk)
    preconditions: &web-preconditions
      - sh: command -v trunk
        msg: "trunk not found — run: cargo install trunk --locked"
      - sh: rustup target list --installed | grep -qx wasm32-unknown-unknown
        msg: "wasm target missing — run: rustup target add wasm32-unknown-unknown"
    deps: [assets:manifest]
    cmds:
      - echo "Open http://localhost:8080/ (add ?cracktro and/or ?gfx=ega|c64|cga|hercules, e.g. ?cracktro&gfx=c64)"
      - trunk serve {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  web:build:
    desc: Build for the browser into dist/ (PROFILE=release, then zip dist/ for itch.io)
    preconditions: *web-preconditions
    deps: [assets:manifest]
    cmds:
      - trunk build {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  web:export:
    desc: Release browser build copied to DEST for embedding (e.g. DEST=../my-site/static/cookie-doh)
    requires:
      vars: [DEST]
    preconditions: *web-preconditions
    cmds:
      # Own dist dir, so a running `task web` doesn't clobber it mid-copy.
      - trunk build --release --dist target/web-release
      - mkdir -p "{{.DEST}}"
      - cp target/web-release/cookie-doh.js target/web-release/cookie-doh_bg.wasm target/web-release/THIRD_PARTY_LICENSES.html "{{.DEST}}/"
      - echo "Exported to {{.DEST}} - embed with embed/CookieDoh.svelte (base = its URL path)"

  assets:manifest:
    desc: Regenerate assets/manifest.txt, the list of files the web build preloads
    dir: assets
    cmds:
      - |
        {
          echo "# Files the web build preloads before Game::init (one path per line, relative to assets/)."
          echo "# Regenerate with: task assets:manifest"
          find . -type f ! -name manifest.txt ! -name '.*' | sed 's|^\./||' | LC_ALL=C sort
        } > manifest.txt
